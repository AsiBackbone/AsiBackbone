verbose = "info"
no_progress = true

max_retries = 4
timeout = 20
retry_wait_time = 5

max_concurrency = 8
host_concurrency = 2

# A response must resolve successfully after retries. In particular, HTTP 429
# remains a retryable failure instead of being mistaken for a valid target.
# Pull request and push runs widen this to accept HTTP 503 on the command line
# (see .github/workflows/link-validation.yml); scheduled and manual runs keep
# this list, so a link that stays unavailable is reported as link rot.
accept = ["200..=399"]

# Do not attempt to validate localhost/private addresses used in
# local-development documentation.
exclude_all_private = true

# Email-address validation is outside the scope of documentation links.
include_mail = false

# Exclusions suppress link rot rather than reporting it, so each one needs a
# reason that is specific to the URL and not merely "this is sometimes slow".
# Transient slowness and throttling are handled by bounded retries.
exclude = [
  # Private vulnerability reporting may intentionally return 404 to
  # unauthenticated link checkers.
  '^https://github\.com/AsiBackbone/AsiBackbone/security/advisories/new$',

  # The canonical DOI remains the published citation target, but Zenodo's
  # resolver can repeatedly redirect or time out for automated link checks.
  '^https://doi\.org/10\.5281/zenodo\.20546032$'
]
