version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "15:00"
      timezone: "America/Chicago"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    # Remain on the .NET 10 framework and EF Core package lines until the
    # repository deliberately schedules and validates a .NET 11 migration.
    # Patch and minor servicing updates within the current majors remain enabled.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "Microsoft.Extensions.*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "System.Security.Cryptography.Pkcs"
        update-types:
          - "version-update:semver-major"
    groups:
      microsoft-entity-framework-core:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
      test-dependencies:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "xunit*"
          - "coverlet*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "15:30"
      timezone: "America/Chicago"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
