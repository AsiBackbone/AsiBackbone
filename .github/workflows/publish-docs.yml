name: Publish Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:


# Deny all GitHub token permissions by default.
permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  CONFIGURATION: Release
  SOLUTION_FILE: './AsiBackbone.slnx'
  PAGES_BASE_URL: 'https://AsiBackbone.github.io/AsiBackbone'
  CORE_COVERAGE_OUTPUT: '${{ github.workspace }}/artifacts/core-coverage'
  CORE_BRANCH_COVERAGE_THRESHOLD: 90

jobs:
  build-docs:
    name: Build documentation
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false


      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }} --locked-mode

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore /p:ContinuousIntegrationBuild=true

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Run tests with coverage
        shell: pwsh
        run: >
          ./scripts/Invoke-MtpCoverage.ps1
          -SolutionPath "${{ env.SOLUTION_FILE }}"
          -Configuration "${{ env.CONFIGURATION }}"
          -OutputRoot "${{ github.workspace }}/artifacts/test-results"
          -NoBuild
          -NoRestore

      - name: Generate coverage report
        shell: pwsh
        run: |
          dotnet reportgenerator `
            -reports:"./artifacts/test-results/coverage.cobertura.xml" `
            -targetdir:"./artifacts/coverage-report" `
            -reporttypes:"Html;MarkdownSummaryGithub;Cobertura" `
            -assemblyfilters:"-*.Tests" `
            -filefilters:"-**/bin/**;-**/obj/**;-**/*.g.cs"

      - name: Generate Core branch coverage report
        shell: pwsh
        run: |
          dotnet reportgenerator `
            -reports:"./artifacts/test-results/coverage.cobertura.xml" `
            -targetdir:"./artifacts/core-branch-coverage-report" `
            -reporttypes:"Html;MarkdownSummaryGithub;Cobertura" `
            -assemblyfilters:"+AsiBackbone.Core;-*.Tests" `
            -filefilters:"-**/bin/**;-**/obj/**;-**/*.g.cs"

      - name: Preserve deployed mutation reports
        shell: bash
        run: |
          set -euo pipefail

          preserve_root="./artifacts/preserved-pages"
          mkdir -p "$preserve_root"

          # Each Stryker report is one self-contained index.html (html reporter), so only that file is fetched.
          # A 404 means the report was never published. Any other failure (for example a transient 503 from
          # Pages) is retried and then fails the job, because deploying without the report would drop it from
          # the site and every later deploy would carry that gap forward.
          max_attempts=5

          for report in core aspnetcore signing-managedkey opentelemetry; do
            report_url="${PAGES_BASE_URL%/}/mutation/${report}/index.html"
            report_file="$preserve_root/mutation/${report}/index.html"
            mkdir -p "$(dirname "$report_file")"

            echo "Attempting to preserve deployed mutation report from $report_url"

            status=""
            for attempt in $(seq 1 "$max_attempts"); do
              status="$(curl --silent --show-error --location --output "$report_file" --write-out '%{http_code}' "$report_url" || true)"

              if [ "$status" = "200" ] || [ "$status" = "404" ]; then
                break
              fi

              echo "Attempt $attempt of $max_attempts for $report returned HTTP ${status:-no response}."
              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep $((attempt * 10))
              fi
            done

            case "$status" in
              200)
                if [ ! -s "$report_file" ]; then
                  echo "::error::Deployed mutation report for $report returned an empty body."
                  exit 1
                fi
                echo "Preserved deployed mutation report: $report"
                ;;
              404)
                rm -f "$report_file"
                rmdir "$(dirname "$report_file")" 2>/dev/null || true
                echo "::warning::No deployed mutation report found for: $report"
                ;;
              *)
                rm -f "$report_file"
                rmdir "$(dirname "$report_file")" 2>/dev/null || true
                echo "::error::Could not preserve deployed mutation report for $report (last HTTP ${status:-no response}). Failing instead of deploying the site without it."
                exit 1
                ;;
            esac
          done

          if [ -d "$preserve_root/mutation" ]; then
            find "$preserve_root/mutation" -maxdepth 3 -type f | sort
          fi

      - name: Build DocFX site
        run: dotnet tool run docfx -- docs/docfx.json --warningsAsErrors

      - name: Test documentation landing-page validator
        shell: pwsh
        run: ./scripts/Validate-LandingPage.ps1 -SelfTest

      - name: Validate documentation landing page
        shell: pwsh
        run: ./scripts/Validate-LandingPage.ps1 -SiteDirectory ./docs/_site

      - name: Validate documentation continuity and cross-repository links
        shell: pwsh
        run: ./scripts/Validate-DocumentationLinks.ps1

      - name: Copy coverage report to DocFX output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "./docs/_site/coverage" -Force | Out-Null
          Copy-Item -Path "./artifacts/coverage-report/*" -Destination "./docs/_site/coverage" -Recurse -Force

      - name: Copy Core branch coverage report to DocFX output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "./docs/_site/coverage/core" -Force | Out-Null
          Copy-Item -Path "./artifacts/core-branch-coverage-report/*" -Destination "./docs/_site/coverage/core" -Recurse -Force

      - name: Restore deployed mutation reports to DocFX output
        shell: bash
        run: |
          set -euo pipefail

          preserved_mutation="./artifacts/preserved-pages/mutation"
          output_mutation="./docs/_site/mutation"

          if [ -d "$preserved_mutation" ] && find "$preserved_mutation" -type f | grep -q .; then
            mkdir -p "$output_mutation"
            cp -a "$preserved_mutation/." "$output_mutation/"
            echo "Restored preserved mutation reports to $output_mutation"
            find "$output_mutation" -maxdepth 3 -type f | sort
          else
            echo "No preserved mutation reports found to restore."
          fi

      - name: Ensure published HTML metadata
        shell: pwsh
        run: |
          ./scripts/Ensure-PublishedHtmlMetadata.ps1 `
            -SiteDirectory "./docs/_site" `
            -NoIndexPathPrefix @("coverage", "mutation")

      - name: Remove internal DocFX build manifest
        # manifest.json is a DocFX build artifact with no published consumer; see AsiBackbone/.github LANDING-PAGE-STANDARD.md.
        run: rm -- docs/_site/manifest.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/_site

  deploy-docs:
    name: Deploy documentation
    needs: build-docs
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
