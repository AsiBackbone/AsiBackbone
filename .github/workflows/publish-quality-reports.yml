name: Publish Quality Reports

on:
  workflow_dispatch:
  release:
    types: [published]

# Deny token permissions by default; each job grants only what it requires.
permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  CONFIGURATION: Release
  SOLUTION_FILE: './AsiBackbone.slnx'
  CORE_TEST_PROJECT: './tests/AsiBackbone.Core.Tests/AsiBackbone.Core.Tests.csproj'
  CORE_COVERAGE_OUTPUT: '${{ github.workspace }}/artifacts/core-coverage'
  CORE_BRANCH_COVERAGE_THRESHOLD: 90

jobs:
  build-docs:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false


      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }} --locked-mode

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore /p:ContinuousIntegrationBuild=true

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Run tests with coverage
        shell: pwsh
        run: >
          ./scripts/Invoke-MtpCoverage.ps1
          -SolutionPath "$env:SOLUTION_FILE"
          -Configuration "$env:CONFIGURATION"
          -OutputRoot "./artifacts/test-results"
          -NoBuild
          -NoRestore

      - name: Run Core tests with branch coverage gate
        shell: pwsh
        run: >
          ./scripts/Invoke-MtpCoverage.ps1
          -ProjectPath "$env:CORE_TEST_PROJECT"
          -Configuration "$env:CONFIGURATION"
          -OutputRoot "$env:CORE_COVERAGE_OUTPUT"
          -Include "[AsiBackbone.Core]*"
          -BranchThreshold "$env:CORE_BRANCH_COVERAGE_THRESHOLD"
          -NoBuild
          -NoRestore
      - name: List Core coverage outputs
        shell: pwsh
        run: |
          Get-ChildItem -Path "${env:WORKSPACE}" -Recurse -Filter "*.cobertura.xml" |
            ForEach-Object { Write-Host $_.FullName }
        env:
          WORKSPACE: ${{ github.workspace }}


      - name: Generate coverage report
        shell: pwsh
        run: |
          dotnet reportgenerator `
            -reports:"./artifacts/test-results/coverage.cobertura.xml" `
            -targetdir:"./artifacts/coverage-report" `
            -reporttypes:"Html;MarkdownSummaryGithub;Cobertura" `
            -assemblyfilters:"-*.Tests" `
            -filefilters:"-**/bin/**;-**/obj/**;-**/*.g.cs"

      - name: Generate Core branch coverage report
        shell: pwsh
        run: |
          dotnet reportgenerator `
            -reports:"${env:CORE_COVERAGE_OUTPUT}/coverage.cobertura.xml" `
            -targetdir:"./artifacts/core-branch-coverage-report" `
            -reporttypes:"Html;MarkdownSummaryGithub;Cobertura" `
            -assemblyfilters:"+AsiBackbone.Core;-*.Tests" `
            -filefilters:"-**/bin/**;-**/obj/**;-**/*.g.cs"
        env:
          CORE_COVERAGE_OUTPUT: ${{ env.CORE_COVERAGE_OUTPUT }}

      - name: Generate Core mutation report
        shell: pwsh
        working-directory: tests/AsiBackbone.Core.Tests
        run: |
          dotnet tool run dotnet-stryker -- --config-file stryker-config.json --output "../../artifacts/mutation-report/core"

      - name: Generate ASP.NET Core mutation report
        shell: pwsh
        working-directory: tests/AsiBackbone.AspNetCore.Tests
        run: |
          dotnet tool run dotnet-stryker -- --config-file stryker-config.json --output "../../artifacts/mutation-report/aspnetcore"

      - name: Generate managed-key signing mutation report
        shell: pwsh
        working-directory: tests/AsiBackbone.Signing.ManagedKey.Tests
        run: |
          dotnet tool run dotnet-stryker -- --config-file stryker-config.json --output "../../artifacts/mutation-report/signing-managedkey"

      - name: Generate OpenTelemetry mutation report
        shell: pwsh
        working-directory: tests/AsiBackbone.OpenTelemetry.Tests
        run: |
          dotnet tool run dotnet-stryker -- --config-file stryker-config.json --output "../../artifacts/mutation-report/opentelemetry"

      - name: Build DocFX site
        run: dotnet tool run docfx -- docs/docfx.json

      - name: Copy coverage report to DocFX output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "./docs/_site/coverage" -Force | Out-Null
          Copy-Item -Path "./artifacts/coverage-report/*" -Destination "./docs/_site/coverage" -Recurse -Force

      - name: Copy Core branch coverage report to DocFX output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "./docs/_site/coverage/core" -Force | Out-Null
          Copy-Item -Path "./artifacts/core-branch-coverage-report/*" -Destination "./docs/_site/coverage/core" -Recurse -Force

      - name: Copy mutation reports to DocFX output
        shell: pwsh
        run: |
          function Copy-MutationReport {
            param(
              [Parameter(Mandatory = $true)][string]$ReportRoot,
              [Parameter(Mandatory = $true)][string]$TargetRoot
            )

            New-Item -ItemType Directory -Path $TargetRoot -Force | Out-Null

            $indexFile = Get-ChildItem -Path $ReportRoot -Filter "index.html" -Recurse | Select-Object -First 1
            if ($null -eq $indexFile) {
              Write-Host "Stryker report files found under ${ReportRoot}:"
              Get-ChildItem -Path $ReportRoot -Recurse | ForEach-Object { Write-Host $_.FullName }
              throw "Stryker mutation report index.html was not found under $ReportRoot."
            }

            Copy-Item -Path (Join-Path $indexFile.DirectoryName "*") -Destination $TargetRoot -Recurse -Force
          }

          Copy-MutationReport -ReportRoot "./artifacts/mutation-report/core" -TargetRoot "./docs/_site/mutation/core"
          Copy-MutationReport -ReportRoot "./artifacts/mutation-report/aspnetcore" -TargetRoot "./docs/_site/mutation/aspnetcore"
          Copy-MutationReport -ReportRoot "./artifacts/mutation-report/signing-managedkey" -TargetRoot "./docs/_site/mutation/signing-managedkey"
          Copy-MutationReport -ReportRoot "./artifacts/mutation-report/opentelemetry" -TargetRoot "./docs/_site/mutation/opentelemetry"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/_site

  deploy-docs:
    name: Deploy documentation
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
