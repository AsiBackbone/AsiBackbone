name: Stable Release Validation

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: stable-release-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION_PATH: AsiBackbone.slnx
  CONFIGURATION: Release
  PACKAGE_OUTPUT: artifacts/release-validation-packages
  SBOM_OUTPUT: artifacts/release-validation-sbom

jobs:
  stable-release-validation:
    name: Restore, build, test, docs, pack, and smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false


      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Display .NET information
        run: dotnet --info

      - name: Validate version metadata
        shell: pwsh
        run: |
          $arguments = @{}

          if ('${REF_TYPE}' -eq 'tag') {
              $arguments['TagName'] = '${REF_NAME}'
          }

          ./scripts/Validate-VersionConsistency.ps1 @arguments
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}

      - name: Validate Debug solution build coverage
        shell: pwsh
        run: ./scripts/Validate-DebugSolutionBuildCoverage.ps1 -SolutionPath "$env:SOLUTION_PATH"

      - name: Restore dependencies
        run: dotnet restore "$SOLUTION_PATH" --locked-mode

      - name: Build Debug solution smoke
        run: dotnet build "$SOLUTION_PATH" --configuration Debug --no-restore

      - name: Build solution
        run: dotnet build "$SOLUTION_PATH" --configuration "$CONFIGURATION" --no-restore /p:ContinuousIntegrationBuild=true

      - name: Verify formatting
        run: dotnet format "$SOLUTION_PATH" --verify-no-changes --verbosity minimal

      - name: Run tests
        run: >
          dotnet test --solution "$SOLUTION_PATH"
          --configuration "$CONFIGURATION"
          --no-restore
          --no-build
          --verbosity normal
          /p:ContinuousIntegrationBuild=true

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build DocFX site
        run: dotnet tool run docfx -- docs/docfx.json

      - name: Pack packages
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PACKAGE_OUTPUT"

          mapfile -t package_projects < <(find ./src -name '*.csproj' -type f -not -path '*/templates/*' | sort)

          if [ "${#package_projects[@]}" -eq 0 ]; then
            echo "No package projects were found under ./src."
            exit 1
          fi

          for project in "${package_projects[@]}"; do
            echo "Packing $project"
            dotnet pack "$project" \
              --configuration "$CONFIGURATION" \
              --output "$PACKAGE_OUTPUT" \
              /p:ContinuousIntegrationBuild=true
          done

      - name: Validate generated package versions
        shell: pwsh
        run: |
          $arguments = @{
              PackageDirectory = $env:PACKAGE_OUTPUT
          }

          if ('${REF_TYPE}' -eq 'tag') {
              $arguments['TagName'] = '${REF_NAME}'
          }

          ./scripts/Validate-VersionConsistency.ps1 @arguments
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}

      - name: Validate generated NuGet metadata
        shell: pwsh
        run: ./scripts/Validate-NuGetPackageMetadata.ps1 -PackageDirectory "$env:PACKAGE_OUTPUT"

      - name: Generate package SBOMs
        shell: pwsh
        run: ./scripts/New-NuGetPackageSbom.ps1 -PackageDirectory "$env:PACKAGE_OUTPUT" -OutputDirectory "$env:SBOM_OUTPUT"

      - name: Validate dotnet new templates
        shell: bash
        run: bash ./eng/smoke-tests/template-package-smoke.sh "$PACKAGE_OUTPUT"

      - name: Run external consumer smoke test
        shell: bash
        run: bash ./eng/smoke-tests/external-consumer-smoke.sh

      - name: Run stable package integration smoke test
        shell: bash
        run: bash ./eng/smoke-tests/stable-package-integration-smoke.sh

      - name: Attest package provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.PACKAGE_OUTPUT }}/*.nupkg

      - name: Attest package SBOM provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.SBOM_OUTPUT }}/*.json

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asi-backbone-release-validation-packages
          path: ${{ env.PACKAGE_OUTPUT }}/*.nupkg
          if-no-files-found: error

      - name: Upload package SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asi-backbone-release-validation-package-sboms
          path: ${{ env.SBOM_OUTPUT }}/*.json
          if-no-files-found: error
