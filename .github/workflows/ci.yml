name: CI

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION_PATH: AsiBackbone.slnx
  CONFIGURATION: Release
  PACKAGE_OUTPUT: artifacts/packages
  SBOM_OUTPUT: artifacts/package-sbom
  COVERAGE_OUTPUT: artifacts/coverage
  XML_DOCS_OUTPUT: artifacts/xml-docs
  PACKAGE_COVERAGE_OUTPUT: artifacts/coverage/package-baselines
  CORE_TEST_PROJECT: tests/AsiBackbone.Core.Tests/AsiBackbone.Core.Tests.csproj
  CORE_COVERAGE_OUTPUT: artifacts/coverage/core
  LINE_COVERAGE_THRESHOLD: 75
  CORE_BRANCH_COVERAGE_THRESHOLD: 90

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  build-test-pack:
    name: Build, test, and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false


      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Display .NET information
        run: dotnet --info

      - name: Validate Debug solution build coverage
        shell: pwsh
        run: ./scripts/Validate-DebugSolutionBuildCoverage.ps1 -SolutionPath "$env:SOLUTION_PATH"

      - name: Restore
        run: dotnet restore "$SOLUTION_PATH" --locked-mode -p:Configuration="$CONFIGURATION"

      - name: Build Debug solution smoke
        run: dotnet build "$SOLUTION_PATH" --configuration Debug --no-restore

      - name: Build
        run: dotnet build "$SOLUTION_PATH" --configuration "$CONFIGURATION" --no-restore

      - name: Inventory public API XML documentation gaps
        shell: pwsh
        run: >
          ./scripts/Validate-XmlDocumentation.ps1
          -Mode Inventory
          -Configuration "$env:CONFIGURATION"
          -NoRestore
          -OutputPath "$env:XML_DOCS_OUTPUT/cs1591-inventory.md"

      - name: Verify formatting
        run: dotnet format "$SOLUTION_PATH" --verify-no-changes --verbosity minimal

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build DocFX site for public API baseline
        run: dotnet tool run docfx -- docs/docfx.json

      - name: Validate stable public API baseline
        shell: pwsh
        run: ./scripts/Validate-PublicApiBaseline.ps1

      - name: Test branch retention validator
        shell: pwsh
        run: ./scripts/Test-BranchRetention.ps1

      - name: Test durable release evidence generation
        shell: pwsh
        run: ./scripts/Test-ReleaseEvidence.ps1

      - name: Test with coverage gate
        shell: pwsh
        run: >
          ./scripts/Invoke-MtpCoverage.ps1
          -SolutionPath "$env:SOLUTION_PATH"
          -Configuration "$env:CONFIGURATION"
          -OutputRoot "${{ github.workspace }}/${{ env.COVERAGE_OUTPUT }}"
          -LineThreshold "$env:LINE_COVERAGE_THRESHOLD"
          -NoBuild
          -NoRestore

      - name: Test Core with branch coverage gate
        shell: pwsh
        run: >
          ./scripts/Invoke-MtpCoverage.ps1
          -ProjectPath "$env:CORE_TEST_PROJECT"
          -Configuration "$env:CONFIGURATION"
          -OutputRoot "${{ github.workspace }}/${{ env.CORE_COVERAGE_OUTPUT }}"
          -Include "[AsiBackbone.Core]*"
          -BranchThreshold "$env:CORE_BRANCH_COVERAGE_THRESHOLD"
          -NoBuild
          -NoRestore

      - name: Test adapter and provider package coverage baselines
        shell: pwsh
        run: >
          ./scripts/Validate-PackageCoverageBaselines.ps1
          -Configuration "$env:CONFIGURATION"
          -NoBuild
          -NoRestore
          -OutputRoot "$env:PACKAGE_COVERAGE_OUTPUT"

      - name: Pack packages
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PACKAGE_OUTPUT"

          mapfile -t package_projects < <(find ./src -name '*.csproj' -type f -not -path '*/templates/*' | sort)

          if [ "${#package_projects[@]}" -eq 0 ]; then
            echo "No package projects were found under ./src."
            exit 1
          fi

          for project in "${package_projects[@]}"; do
            echo "Packing $project"
            dotnet pack "$project" \
              --configuration "$CONFIGURATION" \
              --output "$PACKAGE_OUTPUT" \
              /p:ContinuousIntegrationBuild=true
          done

      - name: Generate package SBOMs
        shell: pwsh
        run: ./scripts/New-NuGetPackageSbom.ps1 -PackageDirectory "$env:PACKAGE_OUTPUT" -OutputDirectory "$env:SBOM_OUTPUT"

      - name: Validate dotnet new templates
        shell: bash
        run: bash ./eng/smoke-tests/template-package-smoke.sh "$PACKAGE_OUTPUT"

      - name: Attest package provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.PACKAGE_OUTPUT }}/*.nupkg

      - name: Attest package SBOM provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.SBOM_OUTPUT }}/*.json

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asi-backbone-packages
          path: ${{ env.PACKAGE_OUTPUT }}/*.nupkg
          if-no-files-found: error

      - name: Upload package SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asi-backbone-package-sboms
          path: ${{ env.SBOM_OUTPUT }}/*.json
          if-no-files-found: error

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asi-backbone-coverage
          path: ${{ env.COVERAGE_OUTPUT }}/coverage.cobertura.xml
          if-no-files-found: error

      - name: Upload Core branch coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asi-backbone-core-branch-coverage
          path: ${{ env.CORE_COVERAGE_OUTPUT }}/coverage.cobertura.xml
          if-no-files-found: error

      - name: Upload adapter and provider package coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asi-backbone-package-coverage-baselines
          path: ${{ env.PACKAGE_COVERAGE_OUTPUT }}/**
          if-no-files-found: warn

      - name: Upload XML documentation inventory artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asi-backbone-cs1591-inventory
          path: ${{ env.XML_DOCS_OUTPUT }}/cs1591-inventory.md
          if-no-files-found: warn

  efcore-provider-contention:
    name: EF Core provider contention
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    # Real-provider claim contention evidence for EfCoreGovernanceOutboxStore (issue #823). SQLite serializes writers,
    # so these tests only prove anything against servers that lock rows. The credentials below belong to throwaway
    # service containers that exist only for the lifetime of this job.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "AsiBackbone-ci-823!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'AsiBackbone-ci-823!' -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: "asibackbone-ci-823"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      EFCORE_TEST_PROJECT: tests/AsiBackbone.EntityFrameworkCore.Tests/AsiBackbone.EntityFrameworkCore.Tests.csproj

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore "$EFCORE_TEST_PROJECT" --locked-mode -p:Configuration="$CONFIGURATION"

      - name: Build
        run: dotnet build "$EFCORE_TEST_PROJECT" --configuration "$CONFIGURATION" --no-restore

      - name: Test EF Core outbox against SQL Server and PostgreSQL
        env:
          ASIBACKBONE_TEST_SQLSERVER_CONNECTION: "Server=localhost,1433;User Id=sa;Password=AsiBackbone-ci-823!;TrustServerCertificate=True;Encrypt=False"
          ASIBACKBONE_TEST_POSTGRES_CONNECTION: "Host=localhost;Port=5432;Username=postgres;Password=asibackbone-ci-823"
          ASIBACKBONE_TEST_PROVIDERS_REQUIRED: "true"
        run: dotnet test --project "$EFCORE_TEST_PROJECT" --configuration "$CONFIGURATION" --no-build

  codeql-analysis:
    name: CodeQL analysis
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write


    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: csharp
            build-mode: manual

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false


      - name: Setup .NET SDK
        if: matrix.build-mode == 'manual'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Restore dependencies
        if: matrix.build-mode == 'manual'
        run: dotnet restore ${{ env.SOLUTION_PATH }} --locked-mode -p:Configuration=${{ env.CONFIGURATION }}

      - name: Build solution for CodeQL
        if: matrix.build-mode == 'manual'
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration ${{ env.CONFIGURATION }} --no-restore /p:ContinuousIntegrationBuild=true

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
